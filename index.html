<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Region Coordinator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --danger: #e74c3c; --light: #ecf0f1; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar { width: 320px; background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; z-index: 2; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
        .sidebar-header { padding: 15px; background: var(--primary); color: white; }
        .sidebar-header h2 { margin: 0; font-size: 18px; }
        .sidebar-content { flex: 1; padding: 15px; overflow-y: auto; }
        
        .step { margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .step h3 { font-size: 14px; text-transform: uppercase; color: #888; margin-bottom: 10px; }
        
        textarea { width: 100%; height: 100px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; font-family: monospace; }
        button { padding: 8px 12px; cursor: pointer; border: none; border-radius: 4px; font-size: 13px; margin-right: 5px; margin-bottom: 5px; transition: 0.2s; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #2980b9; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #c0392b; }
        .btn-secondary { background: #95a5a6; color: white; }
        
        #status-box { background: var(--light); padding: 10px; border-left: 4px solid var(--accent); margin-bottom: 10px; }
        #current-target { font-weight: bold; display: block; margin-bottom: 5px; color: var(--primary); }
        #instruction { font-size: 12px; color: #666; }

        #main { flex: 1; background: #525659; overflow: auto; display: flex; justify-content: center; padding: 40px; position: relative; }
        #canvas-wrapper { position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        .box-overlay { position: absolute; border: 2px solid rgba(231, 76, 60, 0.8); background: rgba(231, 76, 60, 0.2); pointer-events: none; }
        .box-label { position: absolute; top: -18px; left: -2px; background: var(--danger); color: white; font-size: 10px; padding: 2px 4px; }
        
        .hidden { display: none; }
        #output { height: 120px; font-size: 11px; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="sidebar-header">
        <h2>PDF Region Coordinator</h2>
    </div>
        
    <div class="sidebar-content">
        <div class="step" id="step-config">
            <h3>1. Configuration</h3>
            <label style="font-size:12px;">Define Fields (One per line):</label>
            <textarea id="field-list-input" placeholder="Name&#10;Date&#10;Total Amount&#10;Invoice ID">Name
Date
Invoice No
Total</textarea>
            <br><br>
            <input type="file" id="file-input" accept=".pdf" />
        </div>

        <div class="step hidden" id="step-work">
            <h3>2. Mapping Controls</h3>
            
            <div id="status-box">
                <span id="current-target">Target: None</span>
                <span id="instruction">Instruction: ...</span>
            </div>

            <div style="margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #eee;">
                <button class="btn-secondary" onclick="changePage(-1)">&lt; Prev</button>
                <span id="page-display" style="font-size:12px; font-weight:bold; margin: 0 5px;">Page 1</span>
                <button class="btn-secondary" onclick="changePage(1)">Next &gt;</button>
            </div>

            <div style="display:flex; gap:5px; margin-bottom: 10px;">
                <button class="btn-secondary" onclick="changeZoom(-0.2)">- Zoom</button>
                <button class="btn-secondary" onclick="changeZoom(0.2)">+ Zoom</button>
            </div>

            <button class="btn-danger" onclick="undoLast()">Undo Box</button>
            <button class="btn-secondary" onclick="skipField()">Skip Field</button>
            <button class="btn-secondary" onclick="resetAll()">Reset All</button>
        </div>

        <div class="step hidden" id="step-output">
            <h3>3. Output (JSON)</h3>
            <textarea id="output" readonly></textarea>
            <button class="btn-primary" onclick="copyToClipboard()">Copy JSON</button>
            <button class="btn-secondary" onclick="downloadJSON()">Download .json</button>
        </div>
    </div>
</div>

<div id="main">
    <div id="canvas-wrapper"></div>
</div>

<script>
    let fields = [];
    let pdfDoc = null;
    let pageNum = 1;
    let totalPages = 0;
    let scale = 1.2;
    let currentFieldIndex = 0;
    let clickState = 0;
    let startCoords = { x: 0, y: 0 };
    let collectedData = {};
    let pdfDims = { width: 0, height: 0 };

    const elements = {
        fileInput: document.getElementById('file-input'),
        fieldInput: document.getElementById('field-list-input'),
        wrapper: document.getElementById('canvas-wrapper'),
        stepConfig: document.getElementById('step-config'),
        stepWork: document.getElementById('step-work'),
        stepOutput: document.getElementById('step-output'),
        currentTarget: document.getElementById('current-target'),
        instruction: document.getElementById('instruction'),
        output: document.getElementById('output'),
        pageDisplay: document.getElementById('page-display')
    };

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    elements.fileInput.addEventListener('change', handleFileUpload);

    async function handleFileUpload(e) {
        const file = e.target.files[0];
        if (!file || file.type !== 'application/pdf') return;

        const rawFields = elements.fieldInput.value.trim().split('\n');
        fields = rawFields.map(f => f.trim()).filter(f => f !== "");

        if (fields.length === 0) {
            alert("Please define at least one field name.");
            return;
        }

        const fileReader = new FileReader();
        fileReader.onload = async function() {
            const typedarray = new Uint8Array(this.result);
            pdfDoc = await pdfjsLib.getDocument(typedarray).promise;
            totalPages = pdfDoc.numPages;
            pageNum = 1;
            
            elements.stepWork.classList.remove('hidden');
            elements.stepOutput.classList.remove('hidden');
            
            await renderPage();
            startMapping();
        };
        fileReader.readAsArrayBuffer(file);
    }

    async function renderPage() {
        elements.pageDisplay.innerText = `Page ${pageNum} / ${totalPages}`;
        
        const page = await pdfDoc.getPage(pageNum);
        const viewport = page.getViewport({ scale: scale });
        
        const unscaledViewport = page.getViewport({ scale: 1.0 });
        pdfDims = { width: unscaledViewport.width, height: unscaledViewport.height };

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        elements.wrapper.innerHTML = '';
        elements.wrapper.appendChild(canvas);

        await page.render({ canvasContext: context, viewport: viewport }).promise;

        canvas.addEventListener('mousedown', handleCanvasClick);
        
        redrawBoxes();
    }

    function startMapping() {
        currentFieldIndex = 0;
        collectedData = {};
        updateStatus();
    }

    function handleCanvasClick(e) {
        if (currentFieldIndex >= fields.length) return;

        const rect = e.target.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        if (clickState === 0) {
            startCoords = { x: x, y: y };
            clickState = 1;
            
            const dot = document.createElement('div');
            dot.id = 'temp-dot';
            dot.style.cssText = `position:absolute; left:${x}px; top:${y}px; width:6px; height:6px; background:blue; border-radius:50%; transform:translate(-50%, -50%); pointer-events:none;`;
            elements.wrapper.appendChild(dot);
            
            updateStatus();
        } else {
            document.getElementById('temp-dot')?.remove();
            
            const x0 = Math.min(startCoords.x, x);
            const y0 = Math.min(startCoords.y, y);
            const w = Math.abs(x - startCoords.x);
            const h = Math.abs(y - startCoords.y);

            const pdfRect = [
                parseFloat((x0 / scale).toFixed(2)),
                parseFloat((y0 / scale).toFixed(2)),
                parseFloat((w / scale).toFixed(2)),
                parseFloat((h / scale).toFixed(2))
            ];

            collectedData[fields[currentFieldIndex]] = {
                page: pageNum,
                coords: pdfRect
            };

            drawBox(fields[currentFieldIndex], x0, y0, w, h);

            clickState = 0;
            currentFieldIndex++;
            updateStatus();
            updateOutput();
        }
    }

    function drawBox(label, x, y, w, h) {
        const box = document.createElement('div');
        box.className = 'box-overlay';
        box.style.left = x + 'px';
        box.style.top = y + 'px';
        box.style.width = w + 'px';
        box.style.height = h + 'px';
        
        const labelSpan = document.createElement('span');
        labelSpan.className = 'box-label';
        labelSpan.innerText = label;
        box.appendChild(labelSpan);
        
        elements.wrapper.appendChild(box);
    }

    function redrawBoxes() {
        document.querySelectorAll('.box-overlay').forEach(el => el.remove());
        Object.keys(collectedData).forEach(key => {
            const item = collectedData[key];
            if(item && item.page === pageNum) {
                const [pdfX, pdfY, pdfW, pdfH] = item.coords;
                const x = pdfX * scale;
                const y = pdfY * scale;
                const w = pdfW * scale;
                const h = pdfH * scale;
                drawBox(key, x, y, w, h);
            }
        });
    }

    function updateStatus() {
        if (currentFieldIndex < fields.length) {
            const field = fields[currentFieldIndex];
            elements.currentTarget.innerText = `Current: ${field} (${currentFieldIndex + 1}/${fields.length})`;
            elements.currentTarget.style.color = "#2c3e50";
            
            if (clickState === 0) {
                elements.instruction.innerHTML = "Click the <b style='color:blue'>Top-Left</b> corner.";
            } else {
                elements.instruction.innerHTML = "Click the <b style='color:red'>Bottom-Right</b> corner.";
            }
        } else {
            elements.currentTarget.innerText = "Done!";
            elements.currentTarget.style.color = "green";
            elements.instruction.innerText = "Mapping complete. Check Output.";
        }
    }

    function undoLast() {
        if (clickState === 1) {
            clickState = 0;
            document.getElementById('temp-dot')?.remove();
            updateStatus();
        } else if (currentFieldIndex > 0) {
            currentFieldIndex--;
            const key = fields[currentFieldIndex];
            delete collectedData[key];
            redrawBoxes();
            updateStatus();
            updateOutput();
        }
    }

    function skipField() {
        if (currentFieldIndex < fields.length) {
            collectedData[fields[currentFieldIndex]] = null;
            currentFieldIndex++;
            clickState = 0;
            document.getElementById('temp-dot')?.remove();
            updateStatus();
            updateOutput();
        }
    }

    async function changePage(delta) {
        if(!pdfDoc) return;
        const newPage = pageNum + delta;
        if(newPage >= 1 && newPage <= totalPages) {
            pageNum = newPage;
            clickState = 0;
            document.getElementById('temp-dot')?.remove();
            await renderPage();
            updateStatus();
        }
    }

    function changeZoom(delta) {
        if(!pdfDoc) return;
        scale += delta;
        if(scale < 0.5) scale = 0.5;
        renderPage();
    }

    function resetAll() {
        if(confirm("Clear all mappings?")) {
            collectedData = {};
            currentFieldIndex = 0;
            clickState = 0;
            redrawBoxes();
            updateStatus();
            updateOutput();
        }
    }

    function updateOutput() {
        const outputObj = {
            totalPages: totalPages,
            regions: collectedData
        };
        elements.output.value = JSON.stringify(outputObj, null, 2);
    }

    function copyToClipboard() {
        elements.output.select();
        document.execCommand('copy');
        alert("Copied to clipboard!");
    }

    function downloadJSON() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(elements.output.value);
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", "pdf_coords.json");
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
    }
</script>
</body>
</html>
