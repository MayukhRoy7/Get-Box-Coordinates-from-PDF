<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Region Mapper v2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --sidebar-bg: #ffffff;
            --primary: #6c5ce7;
            --accent: #00b894;
            --warning: #fdcb6e;
            --danger: #d63031;
            --text-dark: #2d3436;
            --text-light: #636e72;
            --step-1: #0984e3;
        }

        body { font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg-color); color: var(--text-dark); overflow: hidden; }

        #sidebar { width: 360px; background: var(--sidebar-bg); border-right: 1px solid #dfe6e9; display: flex; flex-direction: column; box-shadow: 4px 0 15px rgba(0,0,0,0.05); z-index: 10; }
        
        .header { padding: 20px 20px 10px 20px; background: var(--text-dark); color: white; text-align: center; }
        .header h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 1px; }
        
        .vibecode-container { background: var(--text-dark); padding: 0 20px 20px 20px; text-align: center; }
        .btn-vibe {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white; border: none; padding: 10px 15px; width: 100%; border-radius: 6px;
            font-weight: bold; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3); text-decoration: none; display: inline-block;
        }
        .btn-vibe:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(108, 92, 231, 0.5); }

        .scroll-area { flex: 1; overflow-y: auto; padding: 20px; }

        .card { background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #eee; overflow: hidden; }
        .card-header { padding: 12px 15px; font-weight: bold; color: white; display: flex; align-items: center; justify-content: space-between; }
        .card-body { padding: 15px; }

        .step-1 .card-header { background: var(--step-1); }
        .step-2 .card-header { background: var(--primary); }
        .step-3 .card-header { background: var(--accent); }

        textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid #dfe6e9; border-radius: 5px; font-family: monospace; font-size: 13px; resize: vertical; box-sizing: border-box; }
        
        .file-upload label { display: block; width: 100%; padding: 10px; background: #e3f2fd; color: var(--step-1); text-align: center; border-radius: 5px; cursor: pointer; border: 2px dashed var(--step-1); font-weight: 600; box-sizing: border-box; }
        .file-upload input { display: none; }

        .field-item { padding: 8px 12px; border-bottom: 1px solid #f1f1f1; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .field-item.active { background: #fff3cd; border-left: 4px solid var(--warning); color: #856404; font-weight: bold; }
        .field-item.done { color: var(--accent); }

        .control-row { display: flex; gap: 5px; margin-top: 10px; align-items: center; justify-content: center; }
        button { flex: 1; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px; color: white; transition: 0.2s; }
        .btn-undo { background: var(--danger); }
        .btn-skip { background: var(--text-light); }
        .btn-copy { background: var(--text-dark); margin-top: 5px; width: 100%; }
        
        .btn-nav { background: var(--primary); color: white; max-width: 40px; }
        .page-indicator { font-size: 12px; font-weight: bold; color: var(--text-light); width: 80px; text-align: center; }

        #main { flex: 1; background: #636e72; position: relative; overflow: auto; display: flex; justify-content: center; padding: 40px; }
        
        #instruction-bar {
            position: fixed; top: 20px; left: 400px; right: 40px; 
            background: rgba(255, 255, 255, 0.95); padding: 10px 20px; border-radius: 50px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); z-index: 100; font-weight: 600; color: var(--text-dark);
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px);
        }
        
        #canvas-container { position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.5); background: white; cursor: crosshair; }

        .box-overlay { position: absolute; border: 2px solid var(--primary); background: rgba(108, 92, 231, 0.2); z-index: 5; }
        .box-label { position: absolute; top: -20px; left: -2px; background: var(--primary); color: white; padding: 2px 6px; font-size: 10px; border-radius: 3px 3px 0 0; white-space: nowrap; }
        
        #preview-box { position: absolute; border: 2px dashed var(--danger); background: rgba(214, 48, 49, 0.1); pointer-events: none; z-index: 10; display: none; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="header">
        <h1><i class="fas fa-bullseye"></i> PDF Mapper</h1>
    </div>

    <div class="scroll-area">
        <div class="card step-1">
            <div class="card-header">
                <span>1. Setup</span>
                <i class="fas fa-cog"></i>
            </div>
            <div class="card-body">
                <textarea id="field-input" placeholder="Invoice Number&#10;Date&#10;Total">Invoice Number
Date
Total Amount
Vendor Name</textarea>
                <br><br>
                <div class="file-upload">
                    <label for="file-input"><i class="fas fa-file-pdf"></i> Upload PDF</label>
                    <input type="file" id="file-input" accept=".pdf" />
                </div>
            </div>
        </div>

        <div class="card step-2 hidden" id="panel-mapping">
            <div class="card-header">
                <span>2. Mapping</span>
                <i class="fas fa-mouse-pointer"></i>
            </div>
            <div class="card-body">
                <div class="control-row" style="margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
                    <button class="btn-nav" onclick="changePage(-1)"><i class="fas fa-chevron-left"></i></button>
                    <span class="page-indicator" id="page-indicator">Page 1 / ?</span>
                    <button class="btn-nav" onclick="changePage(1)"><i class="fas fa-chevron-right"></i></button>
                </div>

                <div id="field-list-display" style="max-height: 150px; overflow-y:auto; border:1px solid #eee; margin-bottom:10px;"></div>
                
                <div class="control-row">
                    <button class="btn-undo" onclick="undoLast()"><i class="fas fa-undo"></i> Undo</button>
                    <button class="btn-skip" onclick="skipField()">Skip <i class="fas fa-forward"></i></button>
                </div>
                
                <div class="control-row">
                    <button style="background:var(--text-light); max-width:40px;" onclick="adjustZoom(-0.2)"><i class="fas fa-search-minus"></i></button>
                    <span style="font-size:12px; color:var(--text-light)">Zoom</span>
                    <button style="background:var(--text-light); max-width:40px;" onclick="adjustZoom(0.2)"><i class="fas fa-search-plus"></i></button>
                </div>
            </div>
        </div>

        <div class="card step-3 hidden" id="panel-output">
            <div class="card-header">
                <span>3. JSON Output</span>
                <i class="fas fa-code"></i>
            </div>
            <div class="card-body">
                <textarea id="json-output" readonly placeholder="Output will appear here..."></textarea>
                <button class="btn-copy" onclick="copyJSON()"><i class="fas fa-copy"></i> Copy JSON</button>
            </div>
        </div>
    </div>
</div>

<div id="main">
    <div id="instruction-bar" class="hidden">
        <i id="instruction-icon" class="fas fa-info-circle" style="margin-right: 8px;"></i>
        <span id="instruction-text">Welcome! Upload a PDF to start.</span>
    </div>

    <div id="canvas-container">
        <div id="preview-box"></div>
    </div>
</div>

<script>
    let pdfDoc = null;
    let pageNum = 1;
    let totalPages = 0;
    let scale = 1.3;
    let fields = [];
    let currentFieldIndex = 0;
    let clickState = 0;
    let startCoords = { x: 0, y: 0 };
    
    let collectedData = {}; 

    const fileInput = document.getElementById('file-input');
    const container = document.getElementById('canvas-container');
    const previewBox = document.getElementById('preview-box');
    const instructionBar = document.getElementById('instruction-bar');
    const instructionText = document.getElementById('instruction-text');
    const instructionIcon = document.getElementById('instruction-icon');
    const fieldListDisplay = document.getElementById('field-list-display');
    const jsonOutput = document.getElementById('json-output');
    const pageIndicator = document.getElementById('page-indicator');

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const text = document.getElementById('field-input').value;
        fields = text.split('\n').map(s => s.trim()).filter(s => s);
        if (fields.length === 0) { alert("Please enter at least one field name."); return; }

        const reader = new FileReader();
        reader.onload = async function() {
            const typedarray = new Uint8Array(this.result);
            pdfDoc = await pdfjsLib.getDocument(typedarray).promise;
            totalPages = pdfDoc.numPages;
            pageNum = 1;

            await renderPage();
            
            document.getElementById('panel-mapping').classList.remove('hidden');
            document.getElementById('panel-output').classList.remove('hidden');
            instructionBar.classList.remove('hidden');
            
            startMapping();
        };
        reader.readAsArrayBuffer(file);
    });

    async function renderPage() {
        if (!pdfDoc) return;
        
        pageIndicator.innerText = `Page ${pageNum} / ${totalPages}`;

        const page = await pdfDoc.getPage(pageNum);
        const viewport = page.getViewport({ scale: scale });

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        while (container.firstChild) {
            if (container.firstChild.id === 'preview-box') {
                container.firstChild.style.display = 'none';
                container.removeChild(container.firstChild);
            } else {
                container.removeChild(container.firstChild);
            }
        }
        
        container.appendChild(previewBox);
        container.appendChild(canvas);

        await page.render({ canvasContext: ctx, viewport: viewport }).promise;

        container.onmousedown = handleMouseDown;
        container.onmousemove = handleMouseMove;

        redrawVisualBoxes();
    }

    function startMapping() {
        currentFieldIndex = 0;
        collectedData = {};
        clickState = 0;
        updateUI();
    }

    function handleMouseDown(e) {
        if (currentFieldIndex >= fields.length) return;

        const rect = container.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        if (clickState === 0) {
            startCoords = { x: x, y: y };
            clickState = 1;
            
            previewBox.style.display = 'block';
            previewBox.style.left = x + 'px';
            previewBox.style.top = y + 'px';
            previewBox.style.width = '0px';
            previewBox.style.height = '0px';
            
            updateUI();
        } else {
            clickState = 0;
            previewBox.style.display = 'none';
            
            const x0 = Math.min(startCoords.x, x);
            const y0 = Math.min(startCoords.y, y);
            const w = Math.abs(x - startCoords.x);
            const h = Math.abs(y - startCoords.y);

            const pdfRect = [
                parseFloat((x0 / scale).toFixed(2)),
                parseFloat((y0 / scale).toFixed(2)),
                parseFloat((w / scale).toFixed(2)),
                parseFloat((h / scale).toFixed(2))
            ];

            const fieldName = fields[currentFieldIndex];
            collectedData[fieldName] = {
                page: pageNum,
                coords: pdfRect 
            };

            createVisualBox(x0, y0, w, h, fieldName);

            currentFieldIndex++;
            updateUI();
            updateJSON();
        }
    }

    function handleMouseMove(e) {
        if (clickState === 1) {
            const rect = container.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;

            const width = Math.abs(currentX - startCoords.x);
            const height = Math.abs(currentY - startCoords.y);
            const left = Math.min(currentX, startCoords.x);
            const top = Math.min(currentY, startCoords.y);

            previewBox.style.left = left + 'px';
            previewBox.style.top = top + 'px';
            previewBox.style.width = width + 'px';
            previewBox.style.height = height + 'px';
        }
    }

    function createVisualBox(x, y, w, h, label) {
        const box = document.createElement('div');
        box.className = 'box-overlay';
        box.style.left = x + 'px';
        box.style.top = y + 'px';
        box.style.width = w + 'px';
        box.style.height = h + 'px';
        
        const span = document.createElement('span');
        span.className = 'box-label';
        span.innerText = label;
        box.appendChild(span);
        
        container.appendChild(box);
    }

    function redrawVisualBoxes() {
        Object.keys(collectedData).forEach(key => {
            const item = collectedData[key];
            if (item && item.page === pageNum) {
                const [pdfX, pdfY, pdfW, pdfH] = item.coords;
                
                const screenX = pdfX * scale;
                const screenY = pdfY * scale;
                const screenW = pdfW * scale;
                const screenH = pdfH * scale;

                createVisualBox(screenX, screenY, screenW, screenH, key);
            }
        });
    }

    async function changePage(delta) {
        if (!pdfDoc) return;
        const newPage = pageNum + delta;
        if (newPage >= 1 && newPage <= totalPages) {
            pageNum = newPage;
            clickState = 0; 
            previewBox.style.display = 'none';
            await renderPage();
            updateUI();
        }
    }

    function adjustZoom(delta) {
        scale += delta;
        if (scale < 0.5) scale = 0.5;
        renderPage(); 
    }

    function undoLast() {
        if (clickState === 1) {
            clickState = 0;
            previewBox.style.display = 'none';
            updateUI();
        } else if (currentFieldIndex > 0) {
            currentFieldIndex--;
            const key = fields[currentFieldIndex];
            delete collectedData[key];
            
            renderPage(); 
            updateUI();
            updateJSON();
        }
    }

    function skipField() {
        if (currentFieldIndex < fields.length) {
            collectedData[fields[currentFieldIndex]] = null;
            currentFieldIndex++;
            clickState = 0;
            previewBox.style.display = 'none';
            updateUI();
            updateJSON();
        }
    }

    function updateUI() {
        if (currentFieldIndex < fields.length) {
            const name = fields[currentFieldIndex];
            if (clickState === 0) {
                instructionBar.style.borderLeft = "5px solid var(--primary)";
                instructionIcon.className = "fas fa-mouse-pointer";
                instructionIcon.style.color = "var(--primary)";
                instructionText.innerHTML = `Target: <b style="color:var(--primary)">${name}</b>. Click Top-Left.`;
            } else {
                instructionBar.style.borderLeft = "5px solid var(--danger)";
                instructionIcon.className = "fas fa-compress-arrows-alt";
                instructionIcon.style.color = "var(--danger)";
                instructionText.innerHTML = `Target: <b style="color:var(--primary)">${name}</b>. Now Click Bottom-Right.`;
            }
        } else {
            instructionBar.style.borderLeft = "5px solid var(--accent)";
            instructionIcon.className = "fas fa-check-circle";
            instructionIcon.style.color = "var(--accent)";
            instructionText.innerHTML = "Mapping Complete!";
        }

        let html = '';
        fields.forEach((f, i) => {
            let statusClass = '';
            let icon = 'fa-circle';
            let pageBadge = '';

            if (collectedData[f]) {
                pageBadge = `<span style="background:#dfe6e9; padding:2px 5px; border-radius:3px; font-size:10px; margin-right:5px;">P${collectedData[f].page}</span>`;
            }

            if (i < currentFieldIndex) { statusClass = 'done'; icon = 'fa-check-circle'; }
            else if (i === currentFieldIndex) { statusClass = 'active'; icon = 'fa-crosshairs'; }
            
            html += `<div class="field-item ${statusClass}">
                        <span style="font-size:12px;">${i+1}. ${f}</span> 
                        <div>${pageBadge}<i class="fas ${icon}"></i></div>
                     </div>`;
        });
        fieldListDisplay.innerHTML = html;
        
        const activeItem = document.querySelector('.field-item.active');
        if(activeItem) activeItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function updateJSON() {
        const orderedData = {};
        fields.forEach(f => {
            if (collectedData[f] !== undefined) {
                orderedData[f] = collectedData[f];
            }
        });

        const final = {
            metadata: { 
                totalPages: totalPages,
            },
            regions: orderedData
        };
        jsonOutput.value = JSON.stringify(final, null, 2);
    }

    function copyJSON() {
        jsonOutput.select();
        document.execCommand('copy');
        const btn = document.querySelector('.btn-copy');
        const original = btn.innerHTML;
        btn.innerHTML = `<i class="fas fa-check"></i> Copied!`;
        setTimeout(() => btn.innerHTML = original, 2000);
    }
</script>

</body>
</html>
